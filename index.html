<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil ↔ Chinese AI Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; }

    header {
      padding: 14px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    #status {
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      background: #1e293b;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      word-break: break-word;
    }
    #status.recording { background: #7f1d1d; color: #fecaca; font-weight: 600; }
    #status.loading { background: #1e3a8a; color: #bfdbfe; font-weight: 600; }

    #history {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 14px;
      max-width: 92%;
    }
    .card.ta { align-self: flex-start; border-left: 4px solid #f59e0b; }
    .card.zh { align-self: flex-end; border-right: 4px solid #38bdf8; }
    .label { font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    .orig { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 8px; }
    .trans { font-size: 1.15rem; font-weight: 600; color: #ffffff; }
    .speak-btn {
      margin-top: 8px;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .controls {
      padding: 16px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: center;
    }
    #micBtn {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s;
    }
    #micBtn:active { transform: scale(0.97); }
    #micBtn.recording {
      background: #dc2626;
      animation: pulse 1.2s infinite;
    }
    .sub { font-size: 0.78rem; font-weight: 400; opacity: 0.9; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tamil ↔ Chinese</h1>
    <select id="chineseDialect" aria-label="Chinese Dialect">
      <option value="Mandarin">Mandarin (普通话)</option>
      <option value="Cantonese">Cantonese (廣東話)</option>
    </select>
  </header>

  <div id="status">Tap the mic to speak Tamil or Chinese</div>

  <main id="history"></main>

  <footer class="controls">
    <button id="micBtn">
      <span id="micLabel">🎙️ Tap to Speak</span>
      <span class="sub">Auto-Detect: தமிழ் ↔ 中文</span>
    </button>
  </footer>

  <script>
    const statusEl = document.getElementById("status");
    const historyEl = document.getElementById("history");
    const dialectEl = document.getElementById("chineseDialect");
    const micBtn = document.getElementById("micBtn");
    const micLabel = document.getElementById("micLabel");

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentStream = null;

    function speakText(text, lang) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      window.speechSynthesis.speak(utterance);
    }

    function addCard(detected, original, translated) {
      const isTamil = detected === "ta";
      const dialect = dialectEl.value;
      const sourceLabel = isTamil ? "Tamil" : dialect;
      const targetLabel = isTamil ? dialect : "Tamil";
      const ttsLang = isTamil ? (dialect === "Cantonese" ? "zh-HK" : "zh-CN") : "ta-IN";

      const card = document.createElement("div");
      card.className = `card ${detected}`;
      card.innerHTML = `
        <div class="label">${sourceLabel} → ${targetLabel}</div>
        <div class="orig">${original}</div>
        <div class="trans">${translated}</div>
        <button class="speak-btn">🔊 Play Audio</button>
      `;
      card.querySelector(".speak-btn").addEventListener("click", () => speakText(translated, ttsLang));
      historyEl.appendChild(card);
      historyEl.scrollTop = historyEl.scrollHeight;

      speakText(translated, ttsLang);
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function sendToServer(audioBlob, mimeType) {
      statusEl.textContent = "Translating...";
      statusEl.className = "loading";

      try {
        const base64Audio = await blobToBase64(audioBlob);
        const response = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audio: base64Audio,
            mimeType: mimeType || "audio/mp4",
            dialect: dialectEl.value
          })
        });

        const rawResponse = await response.text();
        let result;
        try {
          result = JSON.parse(rawResponse);
        } catch {
          throw new Error(`Server (${response.status}): ${rawResponse.slice(0, 120)}`);
        }

        if (!response.ok) {
          throw new Error(result.error || "Translation failed");
        }

        addCard(result.detected, result.original, result.translated);
        statusEl.textContent = "Done! Tap to speak again.";
        statusEl.className = "";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        statusEl.className = "";
      }
    }

    async function toggleRecording() {
      if (isRecording && mediaRecorder) {
        mediaRecorder.stop();
        return;
      }

      try {
        if (!currentStream || !currentStream.active) {
          currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        audioChunks = [];
        let options = { audioBitsPerSecond: 32000 };
        if (MediaRecorder.isTypeSupported("audio/mp4")) {
          options.mimeType = "audio/mp4";
        } else if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
          options.mimeType = "audio/webm;codecs=opus";
        }

        mediaRecorder = new MediaRecorder(currentStream, options);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          isRecording = false;
          micBtn.classList.remove("recording");
          micLabel.textContent = "🎙️ Tap to Speak";

          const mime = mediaRecorder.mimeType || options.mimeType || "audio/mp4";
          const audioBlob = new Blob(audioChunks, { type: mime });
          sendToServer(audioBlob, mime);
        };

        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add("recording");
        micLabel.textContent = "⏹️ Tap to Stop & Translate";
        statusEl.textContent = "Recording... Speak now";
        statusEl.className = "recording";
      } catch (err) {
        statusEl.textContent = "Mic error: " + err.message;
        statusEl.className = "";
      }
    }

    micBtn.addEventListener("click", toggleRecording);

    function releaseMic() {
      if (isRecording && mediaRecorder) mediaRecorder.stop();
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) releaseMic();
    });
    window.addEventListener("pagehide", releaseMic);
  </script>
</body>
</html>
