<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil ↔ Chinese AI Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; }

    header {
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    header h1 { font-size: 1rem; font-weight: 600; }
    .header-right { display: flex; gap: 8px; align-items: center; }

    select, .key-btn {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #apiPanel {
      display: none;
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      gap: 8px;
    }
    #apiPanel.show { display: flex; }
    #apiKeyInput {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
    }
    #saveKeyBtn {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    #status {
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      background: #1e293b;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
    }
    #status.recording { background: #7f1d1d; color: #fecaca; font-weight: 600; }
    #status.loading { background: #1e3a8a; color: #bfdbfe; font-weight: 600; }

    #history {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 14px;
      max-width: 92%;
    }
    .card.ta { align-self: flex-start; border-left: 4px solid #f59e0b; }
    .card.zh { align-self: flex-end; border-right: 4px solid #38bdf8; }
    .label { font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    .orig { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 8px; }
    .trans { font-size: 1.15rem; font-weight: 600; color: #ffffff; }
    .speak-btn {
      margin-top: 8px;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .controls {
      padding: 16px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: center;
    }
    #micBtn {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s;
    }
    #micBtn:active { transform: scale(0.97); }
    #micBtn.recording {
      background: #dc2626;
      animation: pulse 1.2s infinite;
    }
    .sub { font-size: 0.78rem; font-weight: 400; opacity: 0.9; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tamil ↔ Chinese</h1>
    <div class="header-right">
      <select id="chineseDialect" aria-label="Chinese Dialect">
        <option value="Mandarin">Mandarin (普通话)</option>
        <option value="Cantonese">Cantonese (廣東話)</option>
      </select>
      <button id="toggleKeyBtn" class="key-btn">🔑 Key</button>
    </div>
  </header>

  <div id="apiPanel">
    <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key here..." />
    <button id="saveKeyBtn">Save</button>
  </div>

  <div id="status">Tap the mic to speak Tamil or Chinese</div>

  <main id="history"></main>

  <footer class="controls">
    <button id="micBtn">
      <span id="micLabel">🎙️ Tap to Speak</span>
      <span class="sub">Auto-Detect: தமிழ் ↔ 中文</span>
    </button>
  </footer>

  <script>
    const statusEl = document.getElementById("status");
    const historyEl = document.getElementById("history");
    const dialectEl = document.getElementById("chineseDialect");
    const micBtn = document.getElementById("micBtn");
    const micLabel = document.getElementById("micLabel");
    const apiPanel = document.getElementById("apiPanel");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const toggleKeyBtn = document.getElementById("toggleKeyBtn");
    const saveKeyBtn = document.getElementById("saveKeyBtn");

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentStream = null;

    // Load saved API key
    const savedKey = localStorage.getItem("gemini_api_key") || "";
    apiKeyInput.value = savedKey;
    if (!savedKey) {
      apiPanel.classList.add("show");
      statusEl.textContent = "Please enter your Gemini API Key above and click Save.";
    }

    toggleKeyBtn.addEventListener("click", () => {
      apiPanel.classList.toggle("show");
    });

    saveKeyBtn.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        statusEl.textContent = "API Key cannot be empty.";
        return;
      }
      localStorage.setItem("gemini_api_key", key);
      apiPanel.classList.remove("show");
      statusEl.textContent = "API Key saved! Tap the mic to speak.";
    });

    function speakText(text, lang) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      window.speechSynthesis.speak(utterance);
    }

    function addCard(detected, original, translated) {
      const isTamil = detected === "ta";
      const dialect = dialectEl.value;
      const sourceLabel = isTamil ? "Tamil" : dialect;
      const targetLabel = isTamil ? dialect : "Tamil";
      const ttsLang = isTamil ? (dialect === "Cantonese" ? "zh-HK" : "zh-CN") : "ta-IN";

      const card = document.createElement("div");
      card.className = `card ${detected}`;
      card.innerHTML = `
        <div class="label">${sourceLabel} → ${targetLabel}</div>
        <div class="orig">${original}</div>
        <div class="trans">${translated}</div>
        <button class="speak-btn">🔊 Play Audio</button>
      `;
      card.querySelector(".speak-btn").addEventListener("click", () => speakText(translated, ttsLang));
      historyEl.appendChild(card);
      historyEl.scrollTop = historyEl.scrollHeight;

      speakText(translated, ttsLang);
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function sendToGemini(audioBlob, mimeType) {
      const apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        apiPanel.classList.add("show");
        statusEl.textContent = "Please save your Gemini API Key first.";
        return;
      }

      statusEl.textContent = "Translating with Gemini AI...";
      statusEl.className = "loading";

      try {
        const base64Audio = await blobToBase64(audioBlob);
        const cleanMime = (mimeType || "audio/mp4").split(";")[0];
        const dialect = dialectEl.value;

        const prompt = `Listen to this audio carefully.
1. Detect whether the speaker is speaking Tamil or Chinese (Mandarin/Cantonese).
2. Transcribe what they said accurately in the original script.
3. If they spoke Tamil, translate it to natural ${dialect} (${dialect === "Cantonese" ? "Traditional Chinese / Hong Kong Cantonese" : "Simplified Chinese"}).
4. If they spoke Chinese, translate it to natural spoken Tamil.
Return ONLY valid JSON in this exact format:
{"detected": "ta" or "zh", "original": "transcribed text", "translated": "translated text"}`;

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: cleanMime, data: base64Audio } }
                ]
              }],
              generationConfig: { responseMimeType: "application/json" }
            })
          }
        );

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || "API Error");
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const result = JSON.parse(rawText);

        addCard(result.detected, result.original, result.translated);
        statusEl.textContent = "Done! Tap the mic to speak again.";
        statusEl.className = "";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        statusEl.className = "";
      }
    }

    async function toggleRecording() {
      if (!localStorage.getItem("gemini_api_key")) {
        apiPanel.classList.add("show");
        statusEl.textContent = "Please enter and save your Gemini API Key first.";
        return;
      }

      if (isRecording && mediaRecorder) {
        mediaRecorder.stop();
        return;
      }

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        let options = {};
        if (MediaRecorder.isTypeSupported("audio/mp4")) {
          options = { mimeType: "audio/mp4" };
        } else if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
          options = { mimeType: "audio/webm;codecs=opus" };
        }

        mediaRecorder = new MediaRecorder(currentStream, options);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          isRecording = false;
          micBtn.classList.remove("recording");
          micLabel.textContent = "🎙️ Tap to Speak";
          currentStream.getTracks().forEach(track => track.stop());

          const mime = mediaRecorder.mimeType || options.mimeType || "audio/mp4";
          const audioBlob = new Blob(audioChunks, { type: mime });
          sendToGemini(audioBlob, mime);
        };

        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add("recording");
        micLabel.textContent = "⏹️ Tap to Stop & Translate";
        statusEl.textContent = "Recording... Speak Tamil or Chinese now";
        statusEl.className = "recording";
      } catch (err) {
        statusEl.textContent = "Mic error: " + err.message;
        statusEl.className = "";
      }
    }

    micBtn.addEventListener("click", toggleRecording);
  </script>
</body>
</html>
