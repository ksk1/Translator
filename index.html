<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamil ↔ Chinese Voice Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; }

    header {
      padding: 14px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    #status {
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      background: #1e293b;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
    }
    #status.listening { background: #7f1d1d; color: #fecaca; font-weight: 600; }

    #history {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 14px;
      max-width: 90%;
    }
    .card.tamil { align-self: flex-start; border-left: 4px solid #f59e0b; }
    .card.chinese { align-self: flex-end; border-right: 4px solid #38bdf8; }
    .label { font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .orig { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 8px; }
    .trans { font-size: 1.15rem; font-weight: 600; color: #ffffff; }
    .speak-btn {
      margin-top: 8px;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .speak-btn:hover { background: #475569; }

    .controls {
      padding: 14px 16px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mic-btn {
      padding: 16px 12px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .mic-btn:active { transform: scale(0.97); }
    .mic-btn.tamil-btn { background: #d97706; }
    .mic-btn.chinese-btn { background: #0284c7; }
    .mic-btn.active { outline: 3px solid #ef4444; animation: pulse 1.2s infinite; }
    .sub { font-size: 0.75rem; font-weight: 400; opacity: 0.9; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tamil ↔ Chinese</h1>
    <select id="chineseDialect" aria-label="Chinese Dialect">
      <option value="mandarin">Mandarin (普通话)</option>
      <option value="cantonese">Cantonese (廣東話)</option>
    </select>
  </header>

  <div id="status">Tap a microphone button below to speak</div>

  <main id="history"></main>

  <footer class="controls">
    <button id="btnTamil" class="mic-btn tamil-btn">
      <span>🎙️ Speak Tamil</span>
      <span class="sub">தமிழ் → 中文</span>
    </button>
    <button id="btnChinese" class="mic-btn chinese-btn">
      <span>🎙️ Speak Chinese</span>
      <span class="sub">中文 → தமிழ்</span>
    </button>
  </footer>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const statusEl = document.getElementById("status");
    const historyEl = document.getElementById("history");
    const dialectEl = document.getElementById("chineseDialect");
    const btnTamil = document.getElementById("btnTamil");
    const btnChinese = document.getElementById("btnChinese");

    let recognition = null;
    let isListening = false;

    if (!SpeechRecognition) {
      statusEl.textContent = "Speech recognition is not supported in this browser. Please use Chrome, Edge, or Safari.";
      btnTamil.disabled = true;
      btnChinese.disabled = true;
    }

    function getChineseConfig() {
      if (dialectEl.value === "cantonese") {
        return { speechLang: "zh-HK", apiLang: "zh-TW", ttsLang: "zh-HK", name: "Cantonese" };
      }
      return { speechLang: "zh-CN", apiLang: "zh-CN", ttsLang: "zh-CN", name: "Mandarin" };
    }

    function speakText(text, lang) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      window.speechSynthesis.speak(utterance);
    }

    async function translateText(text, fromApiLang, toApiLang) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromApiLang}|${toApiLang}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.responseData && data.responseData.translatedText) {
        return data.responseData.translatedText;
      }
      throw new Error("Translation failed");
    }

    function addCard(direction, sourceLabel, targetLabel, original, translated, ttsLang) {
      const card = document.createElement("div");
      card.className = `card ${direction}`;
      card.innerHTML = `
        <div class="label">${sourceLabel} → ${targetLabel}</div>
        <div class="orig">${original}</div>
        <div class="trans">${translated}</div>
        <button class="speak-btn">🔊 Play Audio</button>
      `;
      card.querySelector(".speak-btn").addEventListener("click", () => speakText(translated, ttsLang));
      historyEl.appendChild(card);
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function startListening(mode) {
      if (!SpeechRecognition) return;
      if (isListening && recognition) {
        recognition.stop();
        return;
      }

      const zh = getChineseConfig();
      const isTamilInput = mode === "tamil";

      const speechLang = isTamilInput ? "ta-IN" : zh.speechLang;
      const fromApi = isTamilInput ? "ta" : zh.apiLang;
      const toApi = isTamilInput ? zh.apiLang : "ta";
      const ttsLang = isTamilInput ? zh.ttsLang : "ta-IN";
      const sourceLabel = isTamilInput ? "Tamil" : zh.name;
      const targetLabel = isTamilInput ? zh.name : "Tamil";

      recognition = new SpeechRecognition();
      recognition.lang = speechLang;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        statusEl.textContent = `Listening for ${sourceLabel}...`;
        statusEl.classList.add("listening");
        (isTamilInput ? btnTamil : btnChinese).classList.add("active");
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        statusEl.textContent = "Translating...";
        statusEl.classList.remove("listening");

        try {
          const translated = await translateText(transcript, fromApi, toApi);
          addCard(mode, sourceLabel, targetLabel, transcript, translated, ttsLang);
          speakText(translated, ttsLang);
          statusEl.textContent = "Done. Tap a button to speak again.";
        } catch (err) {
          statusEl.textContent = "Translation error. Please try again.";
        }
      };

      recognition.onerror = (event) => {
        statusEl.textContent = `Mic error: ${event.error}. Check microphone permissions.`;
        statusEl.classList.remove("listening");
      };

      recognition.onend = () => {
        isListening = false;
        btnTamil.classList.remove("active");
        btnChinese.classList.remove("active");
        statusEl.classList.remove("listening");
      };

      recognition.start();
    }

    btnTamil.addEventListener("click", () => startListening("tamil"));
    btnChinese.addEventListener("click", () => startListening("chinese"));
  </script>
</body>
</html>
